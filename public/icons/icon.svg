<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A note drawn the way the blog draws its furniture: polygons only, one flat
       colour, sharp corners, nothing behind it. The head is a diamond set down on
       the staff, the stem is a bar that runs into its right tip, the flag a
       parallelogram with a notch — the same facets as the wall clock's face.

       A tab strip follows the system theme, so the ink does too: the desk's
       accent on paper, the accent it lifts to in the dark. -->
  <style>
    .ink { fill: #4f6779; }
    @media (prefers-color-scheme: dark) { .ink { fill: #9ab0c2; } }
  </style>
  <g class="ink">
    <polygon points="3.4,17.4 8.9,14 14.3,17.4 8.8,20.8"/>
    <polygon points="11.9,2.6 14.3,2.6 14.3,17.4 11.9,15.86"/>
    <polygon points="14.3,2.6 20.6,6.3 20.6,10.9 18.4,9.7 14.3,7.5"/>
  </g>
</svg>
